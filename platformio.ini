[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 115200
monitor_rts = 0
monitor_dtr = 0

board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

; Trail-camera collection (TRAILCAM_WIFI_PASS in config.h) needs Bluetooth, which
; overflows IRAM alongside Wi-Fi and the camera with the prebuilt libraries. This
; environment rebuilds the framework to let IRAM spill into SRAM1 (costing only
; the spilled amount of heap) and to run the Bluetooth controller BLE-only, which
; frees more memory than that. The first build compiles ESP-IDF and is slow.
[env:esp32cam-trailcam]
extends = env:esp32cam
; Platform develop commit with the fix for pioarduino issue #563 (the 55.03.312-1
; release refuses its own PlatformIO core in custom_sdkconfig builds), on the
; same Arduino 3.3.12 core as above. Return to the release zip once 3.3.13 is out.
platform = https://github.com/pioarduino/platform-espressif32.git#403deec4acd494207ff90482aadc5aac208bd15b
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12-libs.tar.xz
build_flags =
    ${env:esp32cam.build_flags}
    -DTRAILCAM_BUILD
custom_sdkconfig =
    CONFIG_ESP_SYSTEM_ESP32_SRAM1_REGION_AS_IRAM=y
    CONFIG_BTDM_CTRL_MODE_BLE_ONLY=y
    '# CONFIG_BTDM_CTRL_MODE_BTDM is not set'
