# /etc/nginx/sites-available/esp32-upload
#
# Setup:
#   sudo apt install nginx python3-flask
#   sudo certbot --nginx -d YOUR_DOMAIN   (or generate a self-signed cert)
#   cp upload-token.map.example upload-token.map   (then put your token in it)
#   sudo ln -s /etc/nginx/sites-available/esp32-upload /etc/nginx/sites-enabled/
#   sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=20r/m;

map $http_x_upload_token $token_ok {
    # The token itself is in upload-token.map (gitignored); see upload-token.map.example.
    include /etc/nginx/upload-token.map;
    default 0;
}

server {
    listen 443 ssl;
    server_name nodroid.lecomber.net;

    ssl_certificate     /etc/letsencrypt/live/nodroid.lecomber.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodroid.lecomber.net/privkey.pem;

    location /upload {
        # Reject anything without a valid token before it touches the app.
        if ($token_ok = 0) {
            return 403;
        }
        limit_except POST      { deny all; }
        limit_req zone=upload_zone burst=10 nodelay;
        client_max_body_size   50M;

        proxy_pass             http://upload_server:8080;
        proxy_read_timeout     120s;
        proxy_set_header       X-Filename $http_x_filename;
    }

    # Camera event pages (github.com/koyli/trailcam-review), behind a password.
    location /cams/ {
        auth_basic           "Cameras";
        auth_basic_user_file /etc/nginx/cams.htpasswd;
        alias                /srv/cams/web/;
        add_header           X-Robots-Tag "noindex" always;
        add_header           Cache-Control "private" always;
    }
    location /cams/media/ {
        auth_basic           "Cameras";
        auth_basic_user_file /etc/nginx/cams.htpasswd;
        alias                /srv/capture/;
        add_header           X-Robots-Tag "noindex" always;
        add_header           Cache-Control "private" always;
        location ~ /\.      { deny all; }
    }
    # Answers to "check by eye" sightings on those pages (trailcam-review's web service).
    location /cams/api/ {
        auth_basic           "Cameras";
        auth_basic_user_file /etc/nginx/cams.htpasswd;
        limit_except GET POST { deny all; }
        client_max_body_size 8k;
        # Looked up when used, so nginx still starts if the service is down.
        resolver             127.0.0.11 valid=30s;
        set $cams_api        trailcam-web;
        proxy_pass           http://$cams_api:8080;
        proxy_set_header     Host $host;
    }

    # No public access to anything else.
    location / {
        return 404;
    }
}

server {
    listen 80;

    # Let's Encrypt certificate renewal (certbot webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Drop all other plain-HTTP connections without revealing anything.
    location / {
        return 444;
    }
}
