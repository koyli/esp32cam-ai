services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-upload.conf:/etc/nginx/conf.d/default.conf:ro
      - ./upload-token.map:/etc/nginx/upload-token.map:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      # Camera event pages and clips (trailcam-review), read-only.
      - /home/ubuntu/trailcam-review/web:/srv/cams/web:ro
      - /home/ubuntu/capture:/srv/capture:ro
      - /home/ubuntu/.config/trailcam/cams.htpasswd:/etc/nginx/cams.htpasswd:ro
    networks:
      - default
      # Reaches trailcam-review's web service, which records answers given on the pages.
      - cams
    depends_on:
      - upload_server
    restart: unless-stopped

  upload_server:
    build: .
    user: "1001:1001"
    volumes:
      - /home/ubuntu/recordings:/recordings
      # Trail-camera photos/videos from the ESP32, reviewed by trailcam-review.
      - /home/ubuntu/capture/trailcam:/trailcam
      # Motion clips from the ESP32, also reviewed by trailcam-review.
      - /home/ubuntu/capture/motion/esp32cam:/motion
    environment:
      - UPLOAD_DIR=/recordings
      - TRAILCAM_DIR=/trailcam
      - MOTION_DIR=/motion
    restart: unless-stopped

networks:
  # Created by trailcam-review (`docker compose up -d web` there), so start that first.
  cams:
    external: true
